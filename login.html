<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-bg">

    <div class="login-box">
        <h2>Student Login</h2>

        <input type="text" id="username" placeholder="Username">

        <button type="button" onclick="login()">Login</button>

        <p id="error"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
